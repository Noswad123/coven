[package]
name = "coven"
version = "0.1.0-dev"
edition = "2024"
rust-version = "1.85"
description = "Coven's native orchestration core (incremental migration)"
license = "MIT"

[[bin]]
name = "coven-rs"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6", default-features = false, features = ["std", "derive", "help", "usage"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3.27"
