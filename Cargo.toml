[package]
name = "coven"
version = "0.1.0-dev"
edition = "2024"
rust-version = "1.85"
description = "Local file-backed multi-agent workspaces"
homepage = "https://github.com/Noswad123/coven"
repository = "https://github.com/Noswad123/coven"
license = "MIT"
# Source builds ship native code/assets, not the checkout-only legacy runner.
# Python files below are development oracles (some are include_str! inputs),
# never installed runtime payload. The full regression gate needs the checkout;
# its tests/ harness and legacy oracle are intentionally not a source-package API.
include = [
    "/Cargo.toml",
    "/Cargo.lock",
    "/LICENSE",
    "/src/**/*.rs",
    "/src/**/*.py",
    "/src/workspace_assets/*.txt",
    "/src/execution/inspection/projection/vectors.json",
    "/examples/**/*.json",
    "/examples/**/*.md",
    "/tests/retirement/fixtures/*.json",
    "/tests/retirement/reviews/*.json",
    # Rust unit-test modules import these fixtures at compile time.
    "/tests/support/interactive_session_server.rs",
    "/tests/support/session_prompt_fixture.rs",
    "/tests/native_package.rs",
    # Never collect nested harness build outputs or interim source trees.
    "!/src/**/target/**",
    "!/src/**/src/**",
]

[[bin]]
name = "coven"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6", default-features = false, features = ["std", "derive", "help", "usage"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
# Git SHA-1 object integrity (not authentication); cached native digest backend.
ring = { version = "0.17.14", default-features = false }
ryu = "1.0"
toml = "0.8"
# Use the already-locked codec directly for surgical provider TOML edits.
toml_edit = "0.22"
tempfile = "3.27"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
